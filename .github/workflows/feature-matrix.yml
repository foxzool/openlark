name: Feature Matrix Testing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Run feature matrix testing every 3 days at 00:00 UTC
    - cron: '0 0 */3 * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TOOLCHAIN: stable
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Test core feature combinations
  feature-combinations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          # Individual features (from root Cargo.toml)
          - "auth"
          - "docs"
          - "communication"
          - "hr"
          - "ai"
          - "meeting"
          - "cardkit"
          - "security"
          - "workflow"
          - "application"
          - "websocket"
          - "platform"
          - "analytics"
          - "user"
          - "bot"
          - "pay"
          - "docs-base"
          - "docs-bitable"

          # Important combinations
          - "communication,auth"
          - "docs,auth"
          - "communication,docs"
          - "communication,websocket"
          - "hr,communication"
          - "docs,docs-base,docs-bitable"

          # Recommended feature sets
          - "essential"

          # Edge cases
          - "" # no features
          
    steps:
      - uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.CARGO_TOOLCHAIN }}

      - name: Cache Cargo build files
        uses: Swatinem/rust-cache@v2

      - name: Build with feature combination
        run: |
          echo "Testing feature combination: ${{ matrix.features }}"
          if [ -z "${{ matrix.features }}" ]; then
            echo "Building with no features (minimal build)"
            timeout 15m cargo build --no-default-features
          else
            echo "Building with features: ${{ matrix.features }}"
            timeout 15m cargo build --no-default-features --features "${{ matrix.features }}"
          fi

      - name: Test with feature combination
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            echo "Testing with no features"
            timeout 10m cargo test -p openlark -p openlark-client --no-default-features --lib
          else
            echo "Testing with features: ${{ matrix.features }}"
            # 同时选择根 crate 与 client：root-only feature 由 openlark 解析，并通过
            # 依赖关系把对应 client feature 传播给 catalog contract tests。
            timeout 10m cargo test -p openlark -p openlark-client --no-default-features --features "${{ matrix.features }}" --lib
          fi

  # Advanced feature matrix testing using cargo-hack
  feature-matrix-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify feature matrix failure propagation
        run: python3 -m unittest tools.tests.test_feature_matrix -v

  cargo-hack-testing:
    needs: feature-matrix-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [individual, core]
    env:
      FEATURE_MATRIX_REPORT: reports/feature-matrix/${{ matrix.phase }}.json
      # 每个 phase 最多执行 20 分钟；job 的其余 10 分钟留给 setup 与报告。
      FEATURE_MATRIX_TIMEOUT_SECONDS: "1200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.CARGO_TOOLCHAIN }}

      - name: Install cargo-hack
        if: matrix.phase == 'individual'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45

      - name: Cache Cargo build files
        uses: Swatinem/rust-cache@v2

      # Test each feature individually
      - name: Test each feature individually
        if: matrix.phase == 'individual'
        run: |
          python3 tools/run_feature_matrix.py individual --report "$FEATURE_MATRIX_REPORT" --timeout-seconds "$FEATURE_MATRIX_TIMEOUT_SECONDS"

      # Test feature combinations that are likely to be used together
      - name: Test core feature combinations
        if: matrix.phase == 'core'
        run: |
          python3 tools/run_feature_matrix.py core --report "$FEATURE_MATRIX_REPORT" --timeout-seconds "$FEATURE_MATRIX_TIMEOUT_SECONDS"

      - name: Upload feature matrix execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-matrix-${{ matrix.phase }}
          path: ${{ env.FEATURE_MATRIX_REPORT }}
          if-no-files-found: error
